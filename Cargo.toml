[package]
name = "homepage"
version = "0.7.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Private personal start page: services, LAN IPv6, todos, commits and bookmarks"
repository = "https://github.com/zhangchaosd/homepage"

[[bin]]
name = "homepage"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
# Same verifier and store as bookmarkd, so its passkey database can be reused as-is.
bookmarkd-auth = { git = "https://github.com/zhangchaosd/bookmarkd", tag = "v0.6.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
mailparse = "0.18"
mime_guess = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
rust-embed = { version = "8", features = ["compression"] }
semver = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
toml = "0.9"
tower-http = { version = "0.6", features = ["catch-panic", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
